<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Q3 Skills Test</title>

    <style>
        body{
        background-image: url('https://i.pinimg.com/originals/91/a5/ca/91a5caa67a8b0c29cb50f3390a290b55.gif');
        background-repeat: no-repeat;
        background-size: cover;
        }

        h1{
        color: whitesmoke;
        }

        #profile{
            width: 100px;
            border-radius: 50%;
            display: block;
            margin: auto;
        }

        .buttonnamin{
            color: pink;
        }

        .form-control{
            color: white;
        }

        .container{
        border-radius: 5px;
        background-color: rgba(75, 12, 39, 0.769);
        color: #ffbedbb7;
        box-shadow: 1px 2px 6px 7px rgba(255, 15, 107, 0.55);
        padding: 20px;
        height: auto;
        width: auto;
        }

    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg" style="background-color: #ffffff;">
        <div class="container-fluid">
            <div class="collapse navbar-collapse" id="mynavbar">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link">Home</a>
                    </li>
                    
                    <li class="nav-item">
                        <a class="nav-link">Fare Matrix</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link">Schedule</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link">Help</a>
                    </li>
                </ul>

                <form class="d-flex">
                        <input class="form-control me-2" type="text" placeholder="Search">
                        <button class="btn buttonnamin" type="button">Search</button>
                    </form>
            </div>
        </div>
    </nav>

    <br><br>

    <div class="container">
        <div class="row">
            <div class="col-sm-5">
                <img class="rounded-circle" src ="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png" class="#profile">

                <br><br>
            
                <form>
                    <input type="file" class="form-control">
                
                    <br>
                    
                    <div class="d-grid gap-3">
                        <button type="button" class="btn buttonnamin btn-block" onclick="uploadpic()">Upload Photo</button>
                    </div>
                </form>
            </div>

            <div class="col-sm-7">
                <h1><b>CREATE NEW ACCOUNT</b></h1>

                <details class="ontoggle">
                    <summary><b><u>Directions</u></b></summary>
                    <p id="Instructions"></p>
                </details>

                <br>

                <form>
                    <label>FULL Name</label>
                        <input type="text" id="fname" class="form-control">
                    
                    <br>

                    <div class="row">
                        <div class="col-sm-2">
                            <label>Age</label>
                            <input type="number" class="form-control">
                        </div>

                        <div class="col-sm-10">
                            <label>Contact Number</label>
                            <input type="number" class="form-control">
                        </div>
                    </div>

                    <br>

                    <label>Email Address</label>
                        <input type="email" class="form-control">

                    <br>

                    <label>Enter your username</label>
                        <input type="text" class="form-control">

                    <br>

                    <label>Enter your password</label>
                        <input type="password" class="form-control">

                    <br>

                    <input type="checkbox" class="form-check-input" id="agree" name="termsconditions" value="checked">
                    <label class="form-check-label" for="agree">I accept the <b><u style="color: rgb(255, 78, 128)
                    ;">Terms of Use and Privacy Policy</u></b></label>

                    <br><br><br>

                    <div class="d-grid gap-3">
                        <button type="button" class="btn buttonnamin btn-block" onclick="create()"><b>CREATE MY ACCOUNT</b></button>
                    </div>

                    <br>

                    <div class="d-grid gap-3">
                        <button type="button" class="btn buttonnamin btn-block" onclick="window.location.reload()"><b>CANCEL</b></button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function create(){
            var x = document.getElementById("fname").value;
            alert("You have successfully registered your account," + " " + x +"!");
       }

       document.getElementById('Instructions').innerHTML = "Please fill out all required fields in the registration form accurately. Once completed, review your details and click submit to finish.";
    </script>

</body>
</html>
